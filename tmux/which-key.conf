# which-key style hints: while the prefix is active, the status bar lists what
# the next key does instead of the window list.

# Snapshot tmux's default status line so re-sourcing doesn't capture our override
set -gu status-format
run-shell 'tmux set -g @wk_default "$(tmux show -gv "status-format[0]")"'

set -g @wk_prefix "\
#[align=left,bg=#cba6f7,fg=#11111b,bold] PREFIX #[bg=#181825,nobold] \
#[fg=#cba6f7,bold]c#[fg=#cdd6f4,nobold] window  \
#[fg=#cba6f7,bold]-#[fg=#cdd6f4,nobold] split  \
#[fg=#cba6f7,bold]|#[fg=#cdd6f4,nobold] vsplit  \
#[fg=#cba6f7,bold]m#[fg=#cdd6f4,nobold] zoom  \
#[fg=#cba6f7,bold]v#[fg=#cdd6f4,nobold] copy  \
#[fg=#6c7086]│ \
#[fg=#cba6f7,bold]w#[fg=#cdd6f4,nobold] +workmux  \
#[fg=#6c7086]│ \
#[fg=#cba6f7,bold]D#[fg=#cdd6f4,nobold] docker  \
#[fg=#cba6f7,bold]K#[fg=#cdd6f4,nobold] k9s  \
#[fg=#cba6f7,bold]Q#[fg=#cdd6f4,nobold] sql  \
#[fg=#cba6f7,bold]Y#[fg=#cdd6f4,nobold] yazi  \
#[fg=#cba6f7,bold]T#[fg=#cdd6f4,nobold] term  \
#[fg=#6c7086]│ \
#[fg=#cba6f7,bold]r#[fg=#cdd6f4,nobold] reload  \
#[fg=#cba6f7,bold]?#[fg=#cdd6f4,nobold] all keys"

set -g @wk_workmux "\
#[align=left,bg=#cba6f7,fg=#11111b,bold] WORKMUX #[bg=#181825,nobold] \
#[fg=#cba6f7,bold]n#[fg=#cdd6f4,nobold] new feature  \
#[fg=#cba6f7,bold]a#[fg=#cdd6f4,nobold] new feature+prompt  \
#[fg=#cba6f7,bold]p#[fg=#cdd6f4,nobold] review PR  \
#[fg=#cba6f7,bold]i#[fg=#cdd6f4,nobold] start issue  \
#[fg=#cba6f7,bold]d#[fg=#cdd6f4,nobold] dashboard  \
#[fg=#cba6f7,bold]l#[fg=#cdd6f4,nobold] linear  \
#[fg=#cba6f7,bold]w#[fg=#cdd6f4,nobold] worktrees  \
#[fg=#cba6f7,bold]s#[fg=#cdd6f4,nobold] sidebar  \
#[fg=#cba6f7,bold]r#[fg=#cdd6f4,nobold] rebase  \
#[fg=#cba6f7,bold]x#[fg=#cdd6f4,nobold] remove  \
#[fg=#cba6f7,bold]g#[fg=#cdd6f4,nobold] clean merged"

# Check the workmux table first: client_prefix is 1 in any non-root table
set -g status-format[0] "#{?#{==:#{client_key_table},workmux},#{E:@wk_workmux},#{?client_prefix,#{E:@wk_prefix},#{E:@wk_default}}}"
