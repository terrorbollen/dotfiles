# With the status bar off, the prefix is a plain binding so it can start the
# hints timer; prefix None stops tmux handling C-a before that binding sees it.
# -C so client_name is read now: once the delay has passed there is no client
set -gF @wk_script "#{d:current_file}/which-key.sh"
bind -n C-a switch-client -T prefix \; run-shell -b -d 0.2 -C "run-shell -b '#{@wk_script} prefix #{client_name}'"
bind w switch-client -T workmux \; run-shell -b -d 0.2 -C "run-shell -b '#{@wk_script} workmux #{client_name}'"
