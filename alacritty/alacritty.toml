
[font]
size = 14.0

[cursor]
style = "Block"

[colors.cursor]
cursor = "#f4bf75"   # yellow cursor

[colors.normal]
yellow = "#f4bf75"

[font.bold]
family = "MesloLGS Nerd Font Mono"
style = "Bold"

[font.bold_italic]
family = "MesloLGS Nerd Font Mono"
style = "Bold Italic"

[font.italic]
family = "MesloLGS Nerd Font Mono"
style = "Italic"

[font.normal]
family = "MesloLGS Nerd Font Mono"
style = "Regular"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001b[13;2u"

[[keyboard.bindings]]
key = "H"
mods = "Control|Shift"
chars = "\u2660" ## ♠

[[keyboard.bindings]]
key = "J"
mods = "Control|Shift"
chars = "\u2661" ## ♡

[[keyboard.bindings]]
key = "K"
mods = "Control|Shift"
chars = "\u2662" ## ♢

[[keyboard.bindings]]
key = "L"
mods = "Control|Shift"
chars = "\u2664" ## ♤

[[keyboard.bindings]]
key = "S"
mods = "Control|Shift"
chars = "\u2665" ## ♥

[[keyboard.bindings]]
key = "J"
mods = "Control|Alt"
chars = "\u2666" ## ♦

[[keyboard.bindings]]
key = "K"
mods = "Control|Alt"
chars = "\u2667" ## ♧

# [window]
# option_as_alt = "Both"

[general]
import = [
  "~/.config/alacritty/catppuccin-mocha.toml"
]

# Cmd+click refs; inside tmux (mouse on) hold Shift too. tmux/open-ref.sh
# decides how to open each one, and also backs gd in tmux copy mode.
# Defining hints.enabled replaces Alacritty's default URL hint, so it is
# repeated here; it also takes OSC 8 links, e.g. delta's path:line ones.
[[hints.enabled]]
command = { program = "sh", args = ["-c", '"$HOME/.config/tmux/open-ref.sh" "$0"'] }
hyperlinks = true
post_processing = true
persist = false
mouse.enabled = true
binding = { key = "O", mods = "Control|Shift" }
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`\\\\]+"

# INN-123 (also lowercase in branch names), #123 and path/to/file.ext:42
[[hints.enabled]]
regex = '(?i)\binn-[0-9]+\b|#[0-9]{1,5}\b|[\w./~-]*\w\.\w+:[0-9]+'
command = { program = "sh", args = ["-c", '"$HOME/.config/tmux/open-ref.sh" "$0"'] }
mouse = { enabled = true, mods = "Command" }
